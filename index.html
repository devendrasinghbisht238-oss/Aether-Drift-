<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHER DRIFT // SUPERNOVA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: #020206;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, CX, CY, BASE_R;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CX = W / 2;
  CY = H / 2;
  BASE_R = Math.min(W, H) * 0.22;
}
window.addEventListener('resize', resize);
resize();

// --- PROCEDURAL CYBERPUNK SYNTH & SFX ENGINE ---
const AudioEngine = (() => {
  let actx = null;
  let beatTimer = 0;
  let step = 0;
  const bassNotes = [55, 55, 65.41, 55, 73.42, 65.41, 49, 55];

  function init() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }

  function tone(type, f1, f2, dur, vol = 0.12) {
    if (!actx) return;
    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }

  function tickMusic(dt, active, overdrive, isBoss) {
    if (!actx || !active) return;
    beatTimer -= dt;
    if (beatTimer <= 0) {
      beatTimer = overdrive ? 0.135 : (isBoss ? 0.155 : 0.185);
      const mult = overdrive ? 1.5 : (isBoss ? 0.85 : 1);
      const freq = bassNotes[step % bassNotes.length] * mult;
      tone('sawtooth', freq, freq * 0.85, 0.13, 0.05);
      if (step % 4 === 0) tone('sine', 115, 30, 0.15, 0.11);
      if (step % 4 === 2 && overdrive) tone('triangle', 880, 440, 0.05, 0.03);
      step++;
    }
  }

  return {
    init,
    tickMusic,
    shift: (out) => tone('triangle', out ? 290 : 560, out ? 700 : 210, 0.11, 0.13),
    shoot: (od) => tone('sawtooth', od ? 1320 : 940, od ? 420 : 300, 0.05, 0.05),
    kill: (combo) => {
      const pitch = Math.min(1350, 410 + combo * 52);
      tone('sine', pitch, pitch * 1.75, 0.16, 0.15);
      tone('triangle', 155, 42, 0.2, 0.16);
    },
    nearMiss: () => tone('sine', 980, 1480, 0.12, 0.1),
    orb: () => tone('sine', 720, 1480, 0.14, 0.13),
    overdrive: () => {
      tone('sawtooth', 220, 880, 0.35, 0.17);
      tone('sine', 440, 1320, 0.4, 0.14);
    },
    crash: () => {
      tone('sawtooth', 195, 22, 0.65, 0.28);
      tone('square', 92, 18, 0.72, 0.22);
    }
  };
})();

// --- GAME STATE ---
let state = 'MENU';
let holding = false;
let score = 0;
let best = Number(localStorage.getItem('aether_supernova_best') || 0);
let combo = 1;
let comboTimer = 0;
let wasOverdrive = false;
let shake = 0;
let hitStop = 0;
let slowMoTimer = 0;
let glitchTimer = 0;
let flashAlpha = 0;
let flashColor = '#ffffff';
let time = 0;
let difficulty = 1;
let nextBossScore = 1500;
let kills = 0;

const player = {
  angle: -Math.PI / 2,
  angVel: 2.38,
  radius: 100,
  targetRadius: 100,
  trail: [],
  fireCooldown: 0,
  shield: 1
};

let stars = [];
let enemies = [];
let bullets = [];
let pickups = [];
let particles = [];
let shockwaves = [];
let floatTexts = [];
let boss = null;

for (let i = 0; i < 140; i++) {
  stars.push({
    x: Math.random() * 2400 - 1200,
    y: Math.random() * 2400 - 1200,
    z: Math.random() * 2.6 + 0.4,
    size: Math.random() * 2.2 + 0.5
  });
}

function addFloatText(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 1, vy: -54 });
}

function addShockwave(x, y, maxR, color) {
  shockwaves.push({ x, y, r: 8, maxR, color, life: 1 });
}

function spawnParticles(x, y, color, count = 20, speed = 290) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.2 + Math.random() * 0.85) * speed;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      size: 2 + Math.random() * 4.5,
      color,
      life: 1,
      decay: 1.3 + Math.random() * 1.3
    });
  }
}

function startGame() {
  AudioEngine.init();
  state = 'PLAY';
  score = 0;
  kills = 0;
  combo = 1;
  comboTimer = 0;
  wasOverdrive = false;
  difficulty = 1;
  nextBossScore = 1500;
  time = 0;
  slowMoTimer = 0;
  enemies = [];
  bullets = [];
  pickups = [];
  particles = [];
  shockwaves = [];
  floatTexts = [];
  boss = null;
  player.angle = -Math.PI / 2;
  player.radius = BASE_R * 0.68;
  player.trail = [];
  player.shield = 1;
  flashAlpha = 0.42;
  flashColor = '#00f5d4';
  glitchTimer = 0.2;
  addShockwave(CX, CY, BASE_R * 2.5, '#00f5d4');
  AudioEngine.shift(true);
}

function setHold(val) {
  if (val && state !== 'PLAY') {
    startGame();
    return;
  }
  if (holding !== val && state === 'PLAY') {
    AudioEngine.shift(val);
    const px = CX + Math.cos(player.angle) * player.radius;
    const py = CY + Math.sin(player.angle) * player.radius;
    spawnParticles(px, py, val ? '#ff007f' : '#00f5d4', 10, 145);
  }
  holding = val;
}

window.addEventListener('pointerdown', (e) => { e.preventDefault(); setHold(true); });
window.addEventListener('pointerup', () => setHold(false));
window.addEventListener('pointercancel', () => setHold(false));
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (!e.repeat) setHold(true);
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') setHold(false);
});

let spawnTimer = 0;
let orbTimer = 0;

function spawnEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(W, H) * 0.72;
  const isHunter = Math.random() < Math.min(0.5, 0.16 + difficulty * 0.04);
  enemies.push({
    x: CX + Math.cos(angle) * dist,
    y: CY + Math.sin(angle) * dist,
    angle,
    dist,
    speed: (96 + Math.random() * 55) * (1 + difficulty * 0.11),
    spin: (Math.random() - 0.5) * (isHunter ? 1.55 : 0.42),
    size: isHunter ? 14 : 11,
    hp: isHunter ? 2 : 1,
    type: isHunter ? 'hunter' : 'drone',
    grazed: false
  });
}

function spawnEnergyOrb() {
  const outer = Math.random() > 0.45;
  pickups.push({
    angle: Math.random() * Math.PI * 2,
    orbitMult: outer ? 1.38 : 0.68,
    pulse: 0,
    life: 9
  });
}

function spawnBoss() {
  boss = {
    hp: 38,
    maxHp: 38,
    laserAngle: Math.random() * Math.PI * 2,
    laserSpin: 0.78,
    warnTimer: 1.5
  };
  glitchTimer = 0.38;
  shake = 22;
  flashAlpha = 0.48;
  flashColor = '#9b5de5';
  addShockwave(CX, CY, BASE_R * 2.9, '#9b5de5');
  addFloatText(CX, CY - BASE_R * 1.6, '⚠ VOID TITAN DETECTED ⚠', '#ff007f');
  AudioEngine.overdrive();
}

// --- UPDATE ---
let lastTime = performance.now();
function update(rawDt) {
  if (hitStop > 0) {
    hitStop -= rawDt;
    return;
  }

  slowMoTimer = Math.max(0, slowMoTimer - rawDt);
  const dt = slowMoTimer > 0 ? rawDt * 0.42 : rawDt;

  time += dt;
  shake *= Math.pow(0.035, rawDt);
  glitchTimer = Math.max(0, glitchTimer - rawDt);
  flashAlpha = Math.max(0, flashAlpha - rawDt * 1.9);

  const isOverdrive = combo >= 5;
  AudioEngine.tickMusic(rawDt, state === 'PLAY', isOverdrive, !!boss);

  if (isOverdrive && !wasOverdrive && state === 'PLAY') {
    wasOverdrive = true;
    glitchTimer = 0.25;
    flashAlpha = 0.36;
    flashColor = '#ffd166';
    addShockwave(CX, CY, BASE_R * 2.5, '#ffd166');
    addFloatText(CX, CY - 55, '⚡ OVERDRIVE 3X LASER ⚡', '#ffd166');
    AudioEngine.overdrive();
  } else if (!isOverdrive) {
    wasOverdrive = false;
  }

  stars.forEach(s => {
    const spd = isOverdrive ? 48 : 18;
    s.x -= Math.cos(time * 0.15) * spd * s.z * dt;
    s.y -= Math.sin(time * 0.15) * spd * s.z * dt;
    if (s.x < -W) s.x += W * 2;
    if (s.x > W) s.x -= W * 2;
    if (s.y < -H) s.y += H * 2;
    if (s.y > H) s.y -= H * 2;
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += (sw.maxR - sw.r) * 7.5 * dt;
    sw.life -= 2.1 * dt;
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= 1.25 * dt;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }

  if (state !== 'PLAY') {
    player.angle += 1.25 * dt;
    return;
  }

  difficulty = 1 + time * 0.036;

  if (combo > 1) {
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 1;
  }

  if (!boss && score >= nextBossScore) {
    spawnBoss();
  }

  const innerR = BASE_R * 0.68;
  const outerR = BASE_R * 1.38;
  player.targetRadius = holding ? outerR : innerR;
  player.radius += (player.targetRadius - player.radius) * Math.min(1, 17 * dt);

  const speedMult = holding ? 1.3 : 0.96;
  player.angle += player.angVel * speedMult * (1 + difficulty * 0.04) * dt;

  const px = CX + Math.cos(player.angle) * player.radius;
  const py = CY + Math.sin(player.angle) * player.radius;

  const trailColor = isOverdrive ? '#ffd166' : (holding ? '#ff007f' : '#00f5d4');
  player.trail.push({ x: px, y: py, color: trailColor });
  if (player.trail.length > 24) player.trail.shift();

  // Auto-fire Plasma
  player.fireCooldown -= dt;
  if (holding && player.fireCooldown <= 0) {
    player.fireCooldown = isOverdrive ? 0.105 : 0.14;
    const angles = isOverdrive ? [player.angle - 0.16, player.angle, player.angle + 0.16] : [player.angle];
    angles.forEach(a => {
      bullets.push({
        x: px, y: py,
        vx: Math.cos(a) * 690,
        vy: Math.sin(a) * 690,
        color: isOverdrive ? '#ffd166' : '#ffbe0b',
        life: 1.05
      });
    });
    AudioEngine.shoot(isOverdrive);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    if (boss && Math.hypot(b.x - CX, b.y - CY) < 42) {
      bullets.splice(i, 1);
      boss.hp--;
      shake = 6;
      spawnParticles(b.x, b.y, '#9b5de5', 6, 150);
      if (boss.hp <= 0) {
        score += 1000;
        kills++;
        nextBossScore = score + 2200;
        player.shield = 1;
        shake = 32;
        hitStop = 0.085;
        glitchTimer = 0.42;
        flashAlpha = 0.68;
        flashColor = '#ffd166';
        spawnParticles(CX, CY, '#ffd166', 60, 440);
        addShockwave(CX, CY, BASE_R * 3.3, '#ffd166');
        addFloatText(CX, CY - 30, '+1000 TITAN DESTROYED! SHIELD RESTORED', '#ffd166');
        AudioEngine.kill(12);
        boss = null;
      }
      continue;
    }

    if (b.life <= 0) bullets.splice(i, 1);
  }

  if (boss) {
    if (boss.warnTimer > 0) {
      boss.warnTimer -= dt;
    } else {
      boss.laserAngle += boss.laserSpin * dt;
      let diff = Math.atan2(Math.sin(player.angle - boss.laserAngle), Math.cos(player.angle - boss.laserAngle));
      if (Math.abs(diff) < 0.085) {
        triggerPlayerDamage(px, py);
      }
    }
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(0.35, 1.3 - difficulty * 0.13) * (boss ? 1.45 : 1);
  }
  orbTimer -= dt;
  if (orbTimer <= 0) {
    spawnEnergyOrb();
    orbTimer = 2.4;
  }

  for (let i = pickups.length - 1; i >= 0; i--) {
    const o = pickups[i];
    o.pulse += 6 * dt;
    o.life -= dt;
    const ox = CX + Math.cos(o.angle) * (BASE_R * o.orbitMult);
    const oy = CY + Math.sin(o.angle) * (BASE_R * o.orbitMult);
    if (Math.hypot(px - ox, py - oy) < 25) {
      const pts = 50 * combo;
      score += pts;
      combo = Math.min(12, combo + 1);
      comboTimer = 3.4;
      shake = 6;
      spawnParticles(ox, oy, '#ffd166', 16, 190);
      addShockwave(ox, oy, 70, '#ffd166');
      addFloatText(ox, oy - 12, `+${pts} (${combo}x)`, '#ffd166');
      AudioEngine.orb();
      pickups.splice(i, 1);
      continue;
    }
    if (o.life <= 0) pickups.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.dist -= e.speed * dt;
    e.angle += e.spin * dt;
    e.x = CX + Math.cos(e.angle) * e.dist;
    e.y = CY + Math.sin(e.angle) * e.dist;

    let destroyed = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.size + 9) {
        bullets.splice(j, 1);
        e.hp--;
        spawnParticles(e.x, e.y, '#ffbe0b', 7, 150);
        if (e.hp <= 0) {
          const pts = 100 * combo;
          score += pts;
          kills++;
          combo = Math.min(12, combo + 1);
          comboTimer = 3.6;
          shake = 12;
          hitStop = 0.024;
          spawnParticles(e.x, e.y, e.type === 'hunter' ? '#9b5de5' : '#ff007f', 24, 300);
          addShockwave(e.x, e.y, 92, '#ff007f');
          addFloatText(e.x, e.y - 10, `+${pts}`, '#00f5d4');
          AudioEngine.kill(combo);
          enemies.splice(i, 1);
          destroyed = true;
        }
        break;
      }
    }
    if (destroyed) continue;

    const distToPlayer = Math.hypot(px - e.x, py - e.y);

    // Near-Miss Bullet-Time Bonus
    if (!e.grazed && distToPlayer < e.size + 28 && distToPlayer >= e.size + 9) {
      e.grazed = true;
      slowMoTimer = 0.35;
      score += 150;
      addFloatText(px, py - 24, 'NEAR MISS +150', '#00f5d4');
      AudioEngine.nearMiss();
    }

    if (distToPlayer < e.size + 9) {
      enemies.splice(i, 1);
      if (!triggerPlayerDamage(px, py)) return;
      continue;
    }

    if (e.dist < 26) {
      enemies.splice(i, 1);
      addShockwave(CX, CY, 55, '#ff0055');
      shake = 5;
    }
  }

  score += Math.floor(15 * dt * combo);
  if (score > best) {
    best = score;
    localStorage.setItem('aether_supernova_best', best);
  }
}

function triggerPlayerDamage(px, py) {
  if (player.shield > 0) {
    player.shield = 0;
    shake = 22;
    hitStop = 0.055;
    glitchTimer = 0.25;
    flashAlpha = 0.46;
    flashColor = '#00f5d4';
    spawnParticles(px, py, '#00f5d4', 34, 350);
    addShockwave(px, py, 175, '#00f5d4');
    addFloatText(px, py - 22, 'SHIELD ABSORBED!', '#00f5d4');
    AudioEngine.crash();
    return true;
  } else {
    state = 'OVER';
    holding = false;
    slowMoTimer = 0;
    shake = 30;
    hitStop = 0.075;
    glitchTimer = 0.55;
    flashAlpha = 0.68;
    flashColor = '#ff0055';
    spawnParticles(px, py, '#ff0055', 55, 420);
    addShockwave(px, py, 270, '#ff0055');
    AudioEngine.crash();
    if (score > best) {
      best = score;
      localStorage.setItem('aether_supernova_best', best);
    }
    return false;
  }
}

// --- RENDER ---
function drawCyberGrid(isOverdrive) {
  const horizon = CY;
  const gridColor = isOverdrive ? 'rgba(255, 209, 102, 0.17)' : (boss ? 'rgba(155, 93, 229, 0.19)' : 'rgba(0, 245, 212, 0.11)');
  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 1;

  const rays = 16;
  for (let i = -rays; i <= rays; i++) {
    const spread = (i / rays) * W * 1.4;
    ctx.beginPath();
    ctx.moveTo(CX + spread * 0.12, horizon);
    ctx.lineTo(CX + spread, H);
    ctx.stroke();
  }

  const speed = isOverdrive ? 1.65 : 0.78;
  const offset = (time * speed) % 1;
  for (let i = 0; i < 10; i++) {
    const t = (i + offset) / 10;
    const y = horizon + Math.pow(t, 2.2) * (H - horizon);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function draw() {
  const isOverdrive = combo >= 5 && state === 'PLAY';
  ctx.save();

  // Dynamic Camera Subtle Tilt
  if (state === 'PLAY') {
    const tiltX = Math.cos(player.angle) * (holding ? -10 : -4);
    const tiltY = Math.sin(player.angle) * (holding ? -10 : -4);
    ctx.translate(tiltX, tiltY);
  }

  const bgGrad = ctx.createRadialGradient(CX, CY, 15, CX, CY, Math.max(W, H) * 0.78);
  bgGrad.addColorStop(0, isOverdrive ? '#261908' : (boss ? '#1e0b30' : '#0f1329'));
  bgGrad.addColorStop(1, '#020206');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-30, -30, W + 60, H + 60);

  if (shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawCyberGrid(isOverdrive);

  // Stars / Hyperspace Warp Lines in Overdrive
  stars.forEach(s => {
    const sx = CX + s.x;
    const sy = CY + s.y;
    ctx.fillStyle = `rgba(190, 230, 255, ${0.25 + s.z * 0.25})`;
    if (isOverdrive) {
      ctx.fillRect(sx, sy, s.size * 3.5, s.size * 0.8);
    } else {
      ctx.fillRect(sx, sy, s.size, s.size);
    }
  });

  // Additive Bloom Blending Mode
  ctx.globalCompositeOperation = 'lighter';

  const innerR = BASE_R * 0.68;
  const outerR = BASE_R * 1.38;

  ctx.lineWidth = 2;
  ctx.setLineDash([7, 9]);
  ctx.strokeStyle = !holding ? 'rgba(0, 245, 212, 0.52)' : 'rgba(255, 255, 255, 0.12)';
  ctx.beginPath(); ctx.arc(CX, CY, innerR, 0, Math.PI * 2); ctx.stroke();

  ctx.strokeStyle = holding ? (isOverdrive ? 'rgba(255, 209, 102, 0.78)' : 'rgba(255, 0, 127, 0.62)') : 'rgba(255, 255, 255, 0.12)';
  ctx.beginPath(); ctx.arc(CX, CY, outerR, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Central Reactor Core / Boss
  const corePulse = (boss ? 36 : 22) + Math.sin(time * 6) * 3.5;
  const coreCol = boss ? '#9b5de5' : (isOverdrive ? '#ffd166' : (holding ? '#ff007f' : '#00f5d4'));
  const coreGrad = ctx.createRadialGradient(CX, CY, 2, CX, CY, corePulse * 2.4);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.35, coreCol);
  coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath(); ctx.arc(CX, CY, corePulse * 2.4, 0, Math.PI * 2); ctx.fill();

  if (boss) {
    const beamLen = Math.max(W, H);
    const bx = CX + Math.cos(boss.laserAngle) * beamLen;
    const by = CY + Math.sin(boss.laserAngle) * beamLen;
    if (boss.warnTimer > 0) {
      ctx.strokeStyle = 'rgba(255, 0, 127, 0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 10]);
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(bx, by); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(bx, by); ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(bx, by); ctx.stroke();
    }
  }

  pickups.forEach(o => {
    const ox = CX + Math.cos(o.angle) * (BASE_R * o.orbitMult);
    const oy = CY + Math.sin(o.angle) * (BASE_R * o.orbitMult);
    const r = 7.5 + Math.sin(o.pulse) * 2;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(ox, oy, r, 0, Math.PI * 2); ctx.fill();
  });

  bullets.forEach(b => {
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.028, b.y - b.vy * 0.028);
    ctx.stroke();
  });

  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(time * 4.5 + e.angle);
    ctx.fillStyle = e.type === 'hunter' ? '#9b5de5' : '#ff0055';
    ctx.beginPath();
    const sides = e.type === 'hunter' ? 4 : 3;
    for (let s = 0; s < sides; s++) {
      const a = (s / sides) * Math.PI * 2;
      const rx = Math.cos(a) * e.size;
      const ry = Math.sin(a) * e.size;
      if (s === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  if (state !== 'OVER') {
    for (let i = 0; i < player.trail.length; i++) {
      const t = player.trail[i];
      const ratio = i / player.trail.length;
      ctx.fillStyle = t.color;
      ctx.globalAlpha = ratio * 0.55;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 10 * ratio, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const px = CX + Math.cos(player.angle) * player.radius;
    const py = CY + Math.sin(player.angle) * player.radius;

    if (isOverdrive) {
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(px, py);
      for (let k = 1; k <= 3; k++) {
        const ang = player.angle - k * 0.18;
        const rOff = player.radius + (Math.random() - 0.5) * 28;
        ctx.lineTo(CX + Math.cos(ang) * rOff, CY + Math.sin(ang) * rOff);
      }
      ctx.stroke();
    }

    if (player.shield > 0) {
      ctx.strokeStyle = 'rgba(0, 245, 212, 0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, py, 16 + Math.sin(time * 8) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py, 9.5, 0, Math.PI * 2);
    ctx.fill();
  }

  shockwaves.forEach(sw => {
    ctx.strokeStyle = sw.color;
    ctx.globalAlpha = Math.max(0, sw.life);
    ctx.lineWidth = 3.5 * sw.life;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
  });
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  if (glitchTimer > 0) {
    for (let g = 0; g < 5; g++) {
      const gy = Math.random() * H;
      const gh = 4 + Math.random() * 14;
      ctx.fillStyle = g % 2 === 0 ? 'rgba(0, 245, 212, 0.28)' : 'rgba(255, 0, 127, 0.28)';
      ctx.fillRect((Math.random() - 0.5) * 34, gy, W, gh);
    }
  }

  if (boss && state === 'PLAY') {
    const bw = Math.min(280, W * 0.6);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(CX - bw / 2, 22, bw, 8);
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(CX - bw / 2, 22, bw * (boss.hp / boss.maxHp), 8);
  }

  floatTexts.forEach(ft => {
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = '800 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 28px system-ui, sans-serif';
  ctx.fillText(score.toLocaleString(), 24, 46);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '600 13px system-ui, sans-serif';
  ctx.fillText(`BEST ${best.toLocaleString()}`, 24, 67);

  if (combo > 1 && state === 'PLAY') {
    ctx.textAlign = 'right';
    ctx.fillStyle = isOverdrive ? '#ffd166' : '#00f5d4';
    ctx.font = '900 24px system-ui, sans-serif';
    ctx.fillText(isOverdrive ? `⚡ ${combo}x OVERDRIVE` : `${combo}x COMBO`, W - 24, 46);
  }

  if (flashAlpha > 0) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flashAlpha;
    ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.globalAlpha = 1;
  }

  if (state === 'MENU' || state === 'OVER') {
    ctx.fillStyle = 'rgba(2, 2, 6, 0.78)';
    ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.textAlign = 'center';

    if (state === 'MENU') {
      ctx.fillStyle = '#00f5d4';
      ctx.font = '900 42px system-ui, sans-serif';
      ctx.fillText('AETHER DRIFT', CX, CY - 62);

      ctx.fillStyle = '#ffd166';
      ctx.font = '800 14px system-ui, sans-serif';
      ctx.fillText('SUPERNOVA EDITION', CX, CY - 36);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '500 15px system-ui, sans-serif';
      ctx.fillText('HOLD to expand orbit & auto-fire plasma', CX, CY + 4);
      ctx.fillText('Graze enemies for Slow-Mo • 5x Combo = Overdrive', CX, CY + 28);
    } else {
      ctx.fillStyle = '#ff0055';
      ctx.font = '900 40px system-ui, sans-serif';
      ctx.fillText('SIGNAL LOST', CX, CY - 70);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 26px system-ui, sans-serif';
      ctx.fillText(`SCORE: ${score.toLocaleString()}`, CX, CY - 24);

      ctx.fillStyle = '#ffd166';
      ctx.font = '600 15px system-ui, sans-serif';
      ctx.fillText(`BEST: ${best.toLocaleString()}  •  HOSTILES DESTROYED: ${kills}`, CX, CY + 8);
    }

    const pulseAlpha = 0.55 + Math.sin(time * 5) * 0.45;
    ctx.fillStyle = `rgba(0, 245, 212, ${pulseAlpha})`;
    ctx.font = '700 17px system-ui, sans-serif';
    ctx.fillText(state === 'MENU' ? 'TAP OR PRESS SPACE TO LAUNCH' : 'TAP OR PRESS SPACE TO RETRY', CX, CY + 72);
  }

  ctx.restore();
}

function loop(now) {
  const rawDt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(rawDt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
