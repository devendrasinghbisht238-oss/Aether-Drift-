<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHER VANGUARD // 10-LEVEL WARFARE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: #03040a;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// --- 10 LEVELS CONFIGURATION ---
const LEVELS = [
  { num: 1,  name: 'NEON SECTOR',      primary: '#00f5d4', enemy: '#ff0055', bg1: '#0b132b', bg2: '#03040a', target: 18, bossHp: 45 },
  { num: 2,  name: 'SOLAR ASTEROIDS',  primary: '#ffd166', enemy: '#f77f00', bg1: '#241405', bg2: '#050301', target: 24, bossHp: 65 },
  { num: 3,  name: 'CRIMSON NEBULA',   primary: '#ff4d6d', enemy: '#ffbe0b', bg1: '#290610', bg2: '#060103', target: 30, bossHp: 85 },
  { num: 4,  name: 'EMERALD GRID',     primary: '#06d6a0', enemy: '#ff006e', bg1: '#05241b', bg2: '#010604', target: 36, bossHp: 110 },
  { num: 5,  name: 'VOID CITADEL',     primary: '#c77dff', enemy: '#00bbf9', bg1: '#1a082e', bg2: '#040108', target: 42, bossHp: 135 },
  { num: 6,  name: 'COBALT STORM',     primary: '#3a86ff', enemy: '#ffbe0b', bg1: '#071736', bg2: '#010308', target: 48, bossHp: 160 },
  { num: 7,  name: 'PLASMA CORE',      primary: '#ff70a6', enemy: '#70d6ff', bg1: '#2b091c', bg2: '#070104', target: 55, bossHp: 190 },
  { num: 8,  name: 'BIO REACTOR',      primary: '#b5e48c', enemy: '#ff4d6d', bg1: '#162607', bg2: '#030601', target: 62, bossHp: 225 },
  { num: 9,  name: 'OMEGA FORTRESS',   primary: '#f72585', enemy: '#4cc9f0', bg1: '#26051d', bg2: '#060104', target: 70, bossHp: 260 },
  { num: 10, name: 'SINGULARITY GOD',  primary: '#ffffff', enemy: '#ffd166', bg1: '#241f14', bg2: '#050402', target: 80, bossHp: 320 }
];

// --- SYNTH AUDIO ENGINE ---
const AudioEngine = (() => {
  let actx = null;
  let beatTimer = 0;
  let step = 0;
  const bass = [55, 55, 73.42, 65.41, 55, 55, 82.41, 73.42];

  function init() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }

  function tone(type, f1, f2, dur, vol = 0.1) {
    if (!actx) return;
    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }

  function tickMusic(dt, active, lvl) {
    if (!actx || !active) return;
    beatTimer -= dt;
    if (beatTimer <= 0) {
      beatTimer = Math.max(0.11, 0.18 - lvl * 0.005);
      const f = bass[step % bass.length] * (1 + (lvl - 1) * 0.025);
      tone('sawtooth', f, f * 0.85, 0.12, 0.045);
      if (step % 4 === 0) tone('sine', 110, 30, 0.14, 0.1);
      step++;
    }
  }

  return {
    init, tickMusic,
    shoot: (pwr) => tone('sawtooth', 750 + pwr * 120, 260, 0.05, 0.045),
    hit: () => tone('triangle', 320, 140, 0.04, 0.06),
    kill: () => { tone('sine', 520, 980, 0.12, 0.12); tone('triangle', 140, 40, 0.18, 0.14); },
    powerup: () => { tone('sine', 520, 1040, 0.14, 0.14); setTimeout(() => tone('sine', 780, 1560, 0.18, 0.14), 80); },
    nova: () => { tone('sawtooth', 260, 30, 0.6, 0.25); tone('sine', 880, 110, 0.5, 0.2); },
    levelClear: () => {
      [440, 554, 659, 880].forEach((n, idx) => setTimeout(() => tone('triangle', n, n * 1.02, 0.22, 0.15), idx * 90));
    },
    damage: () => tone('sawtooth', 180, 28, 0.45, 0.24)
  };
})();

// --- GAME STATE ---
let state = 'MENU'; // MENU, PLAY, LEVELCLEAR, OVER, VICTORY
let unlockedLevel = Number(localStorage.getItem('av_unlocked') || 1);
let currentLevel = 1;
let score = 0;
let bestScore = Number(localStorage.getItem('av_best') || 0);
let levelKills = 0;
let time = 0;
let shake = 0;
let flashAlpha = 0;
let flashColor = '#ffffff';
let lastTap = 0;

// Player Starfighter
const ship = {
  x: 0, y: 0,
  tx: 0, ty: 0,
  hp: 100,
  maxHp: 100,
  weaponLevel: 1, // 1 to 4
  novaCharges: 2,
  fireTimer: 0,
  invuln: 0,
  tilt: 0
};

let stars = [];
let bullets = [];
let enemyBullets = [];
let enemies = [];
let pickups = [];
let particles = [];
let shockwaves = [];
let floatTexts = [];
let boss = null;
let levelBtns = [];

for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    speed: 60 + Math.random() * 240,
    size: 1 + Math.random() * 2.2
  });
}

function getLvl() {
  return LEVELS[Math.min(LEVELS.length - 1, currentLevel - 1)];
}

function addFloat(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 1 });
}

function addWave(x, y, maxR, color) {
  shockwaves.push({ x, y, r: 10, maxR, color, life: 1 });
}

function spawnExplosion(x, y, color, count = 22, speed = 300) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.2 + Math.random() * 0.85) * speed;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      size: 2 + Math.random() * 4.5,
      color,
      life: 1,
      decay: 1.4 + Math.random() * 1.2
    });
  }
}

function triggerNovaBomb() {
  if (state !== 'PLAY' || ship.novaCharges <= 0) return;
  ship.novaCharges--;
  shake = 28;
  flashAlpha = 0.65;
  flashColor = getLvl().primary;
  addWave(ship.x, ship.y, Math.max(W, H), getLvl().primary);
  addFloat(ship.x, ship.y - 40, '💥 NOVA SHOCKWAVE!', '#ffffff');
  AudioEngine.nova();

  enemyBullets = [];
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    spawnExplosion(e.x, e.y, e.color, 18, 280);
    score += 100 * currentLevel;
    levelKills++;
    enemies.splice(i, 1);
  }
  if (boss) {
    boss.hp -= 35;
    spawnExplosion(boss.x, boss.y, '#ffd166', 35, 350);
  }
}

function startLevel(lvlNum) {
  AudioEngine.init();
  currentLevel = lvlNum;
  state = 'PLAY';
  levelKills = 0;
  bullets = [];
  enemyBullets = [];
  enemies = [];
  pickups = [];
  particles = [];
  shockwaves = [];
  floatTexts = [];
  boss = null;

  ship.x = W / 2;
  ship.y = H * 0.78;
  ship.tx = ship.x;
  ship.ty = ship.y;
  ship.hp = 100;
  ship.invuln = 1.2;
  if (lvlNum === 1) {
    score = 0;
    ship.weaponLevel = 1;
    ship.novaCharges = 2;
  } else {
    ship.novaCharges = Math.min(3, ship.novaCharges + 1);
  }

  flashAlpha = 0.35;
  flashColor = getLvl().primary;
  addFloat(W / 2, H * 0.45, `LEVEL ${currentLevel}: ${getLvl().name}`, getLvl().primary);
}

// --- CONTROLS ---
function updateTarget(clientX, clientY) {
  ship.tx = Math.max(24, Math.min(W - 24, clientX));
  ship.ty = Math.max(60, Math.min(H - 30, clientY));
}

window.addEventListener('pointermove', (e) => {
  if (state === 'PLAY') updateTarget(e.clientX, e.clientY);
});

window.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const mx = e.clientX, my = e.clientY;

  if (state === 'MENU') {
    for (const b of levelBtns) {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        if (b.lvl <= unlockedLevel) startLevel(b.lvl);
        return;
      }
    }
    startLevel(1);
    return;
  }

  if (state === 'LEVELCLEAR') {
    startLevel(currentLevel + 1);
    return;
  }

  if (state === 'OVER' || state === 'VICTORY') {
    state = 'MENU';
    return;
  }

  if (state === 'PLAY') {
    updateTarget(mx, my);
    const now = performance.now();
    if (now - lastTap < 260) triggerNovaBomb();
    lastTap = now;
  }
});

const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ShiftLeft') {
    if (state === 'PLAY') triggerNovaBomb();
    else if (state === 'LEVELCLEAR') startLevel(currentLevel + 1);
    else if (state === 'OVER' || state === 'VICTORY') state = 'MENU';
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// --- SPAWNERS ---
let spawnTimer = 0;

function spawnEnemyWave() {
  const lvl = getLvl();
  const r = Math.random();
  let type = 'interceptor';
  let hp = 1 + Math.floor(currentLevel / 3);
  let speed = 150 + currentLevel * 16;
  let size = 16;
  let color = lvl.enemy;

  if (r < 0.28 && currentLevel >= 2) {
    type = 'gunship';
    hp = 3 + Math.floor(currentLevel / 2);
    speed = 105 + currentLevel * 10;
    size = 22;
    color = '#9b5de5';
  } else if (r < 0.5 && currentLevel >= 3) {
    type = 'dasher';
    hp = 1;
    speed = 260 + currentLevel * 20;
    size = 14;
    color = '#ffbe0b';
  }

  enemies.push({
    x: 40 + Math.random() * (W - 80),
    y: -30,
    vx: (Math.random() - 0.5) * 90,
    vy: speed,
    hp, maxHp: hp,
    size, color, type,
    shootTimer: 1 + Math.random() * 1.5
  });
}

function spawnBoss() {
  const lvl = getLvl();
  boss = {
    x: W / 2,
    y: -90,
    targetY: Math.min(150, H * 0.22),
    hp: lvl.bossHp,
    maxHp: lvl.bossHp,
    dir: 1,
    shootTimer: 1.0,
    pattern: 0
  };
  shake = 20;
  flashAlpha = 0.4;
  flashColor = '#ff0055';
  addFloat(W / 2, H * 0.4, `⚠ LEVEL ${currentLevel} DREADNOUGHT BOSS ⚠`, '#ff0055');
  AudioEngine.nova();
}

// --- UPDATE ---
let lastTime = performance.now();
function update(dt) {
  time += dt;
  shake *= Math.pow(0.03, dt);
  flashAlpha = Math.max(0, flashAlpha - dt * 1.8);

  AudioEngine.tickMusic(dt, state === 'PLAY', currentLevel);

  // Starfield scroll
  stars.forEach(s => {
    s.y += s.speed * (state === 'PLAY' ? 1 + currentLevel * 0.12 : 0.6) * dt;
    if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const w = shockwaves[i];
    w.r += (w.maxR - w.r) * 6.5 * dt;
    w.life -= 2 * dt;
    if (w.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.y -= 45 * dt;
    f.life -= 1.15 * dt;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }

  if (state !== 'PLAY') return;

  const lvl = getLvl();

  // Keyboard movement support
  const kSpd = 460 * dt;
  if (keys['ArrowLeft'] || keys['KeyA']) ship.tx -= kSpd;
  if (keys['ArrowRight'] || keys['KeyD']) ship.tx += kSpd;
  if (keys['ArrowUp'] || keys['KeyW']) ship.ty -= kSpd;
  if (keys['ArrowDown'] || keys['KeyS']) ship.ty += kSpd;
  ship.tx = Math.max(24, Math.min(W - 24, ship.tx));
  ship.ty = Math.max(60, Math.min(H - 30, ship.ty));

  const prevX = ship.x;
  ship.x += (ship.tx - ship.x) * Math.min(1, 16 * dt);
  ship.y += (ship.ty - ship.y) * Math.min(1, 16 * dt);
  ship.tilt = Math.max(-0.45, Math.min(0.45, (ship.x - prevX) * 0.04));
  ship.invuln = Math.max(0, ship.invuln - dt);

  // Auto-Fire Weapon Systems (4 Weapon Levels!)
  ship.fireTimer -= dt;
  const fireInterval = ship.weaponLevel >= 4 ? 0.09 : 0.13;
  if (ship.fireTimer <= 0) {
    ship.fireTimer = fireInterval;
    const col = lvl.primary;
    if (ship.weaponLevel === 1) {
      bullets.push({ x: ship.x, y: ship.y - 18, vx: 0, vy: -780, col, dmg: 1 });
    } else if (ship.weaponLevel === 2) {
      bullets.push({ x: ship.x - 10, y: ship.y - 14, vx: 0, vy: -800, col, dmg: 1 });
      bullets.push({ x: ship.x + 10, y: ship.y - 14, vx: 0, vy: -800, col, dmg: 1 });
    } else if (ship.weaponLevel === 3) {
      bullets.push({ x: ship.x, y: ship.y - 20, vx: 0, vy: -840, col: '#ffd166', dmg: 1.3 });
      bullets.push({ x: ship.x - 12, y: ship.y - 12, vx: -110, vy: -800, col, dmg: 1 });
      bullets.push({ x: ship.x + 12, y: ship.y - 12, vx: 110, vy: -800, col, dmg: 1 });
    } else {
      [-180, -60, 60, 180].forEach((vx, idx) => {
        bullets.push({ x: ship.x + (idx - 1.5) * 8, y: ship.y - 16, vx, vy: -880, col: '#ffd166', dmg: 1.4 });
      });
    }
    AudioEngine.shoot(ship.weaponLevel);
  }

  // Update Player Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -20) bullets.splice(i, 1);
  }

  // Spawn Enemies or Boss
  if (!boss) {
    if (levelKills >= lvl.target) {
      spawnBoss();
    } else {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemyWave();
        spawnTimer = Math.max(0.28, 0.85 - currentLevel * 0.05);
      }
    }
  }

  // Update Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    if (e.x < 25 || e.x > W - 25) e.vx *= -1;

    if (e.type === 'gunship') {
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = 1.6;
        const ang = Math.atan2(ship.y - e.y, ship.x - e.x);
        enemyBullets.push({ x: e.x, y: e.y + 12, vx: Math.cos(ang) * 260, vy: Math.sin(ang) * 260, col: '#ff0055' });
      }
    }

    // Bullet Hit
    let dead = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.size + 8) {
        bullets.splice(j, 1);
        e.hp -= b.dmg;
        spawnExplosion(b.x, b.y, '#ffffff', 4, 120);
        if (e.hp <= 0) {
          score += 100 * currentLevel;
          levelKills++;
          shake = 9;
          spawnExplosion(e.x, e.y, e.color, 20, 260);
          addWave(e.x, e.y, 65, e.color);
          AudioEngine.kill();

          // Drop Weapon / Heal / Nova Powerup
          if (Math.random() < 0.22) {
            const pType = Math.random() < 0.55 ? 'WEAPON' : (Math.random() < 0.7 ? 'HEAL' : 'NOVA');
            pickups.push({ x: e.x, y: e.y, type: pType, vy: 130 });
          }

          enemies.splice(i, 1);
          dead = true;
        } else {
          AudioEngine.hit();
        }
        break;
      }
    }
    if (dead) continue;

    // Collision with Ship
    if (ship.invuln <= 0 && Math.hypot(ship.x - e.x, ship.y - e.y) < e.size + 14) {
      enemies.splice(i, 1);
      damagePlayer(28);
      continue;
    }

    if (e.y > H + 40) enemies.splice(i, 1);
  }

  // Update Boss
  if (boss) {
    boss.y += (boss.targetY - boss.y) * 3 * dt;
    boss.x += boss.dir * (110 + currentLevel * 12) * dt;
    if (boss.x < 85 || boss.x > W - 85) boss.dir *= -1;

    boss.shootTimer -= dt;
    if (boss.shootTimer <= 0) {
      boss.shootTimer = Math.max(0.55, 1.15 - currentLevel * 0.05);
      boss.pattern++;
      const spread = 3 + Math.floor(currentLevel / 3);
      for (let s = 0; s < spread; s++) {
        const ang = Math.PI / 2 + (s - (spread - 1) / 2) * 0.24 + Math.sin(boss.pattern) * 0.15;
        enemyBullets.push({
          x: boss.x, y: boss.y + 30,
          vx: Math.cos(ang) * (270 + currentLevel * 14),
          vy: Math.sin(ang) * (270 + currentLevel * 14),
          col: '#ffbe0b'
        });
      }
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - boss.x, b.y - boss.y) < 52) {
        bullets.splice(j, 1);
        boss.hp -= b.dmg;
        spawnExplosion(b.x, b.y, '#ffd166', 5, 140);
        AudioEngine.hit();
      }
    }

    if (boss.hp <= 0) {
      score += 1500 * currentLevel;
      shake = 32;
      flashAlpha = 0.7;
      flashColor = '#ffd166';
      spawnExplosion(boss.x, boss.y, '#ffd166', 65, 450);
      addWave(boss.x, boss.y, 280, '#ffd166');
      boss = null;
      enemyBullets = [];
      AudioEngine.levelClear();

      if (currentLevel >= 10) {
        state = 'VICTORY';
      } else {
        unlockedLevel = Math.max(unlockedLevel, currentLevel + 1);
        localStorage.setItem('av_unlocked', unlockedLevel);
        state = 'LEVELCLEAR';
      }
    }
  }

  // Update Enemy Bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.x += eb.vx * dt;
    eb.y += eb.vy * dt;
    if (ship.invuln <= 0 && Math.hypot(ship.x - eb.x, ship.y - eb.y) < 14) {
      enemyBullets.splice(i, 1);
      damagePlayer(20);
      continue;
    }
    if (eb.y > H + 20 || eb.x < -20 || eb.x > W + 20) enemyBullets.splice(i, 1);
  }

  // Update Pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.y += p.vy * dt;
    if (Math.hypot(ship.x - p.x, ship.y - p.y) < 28) {
      AudioEngine.powerup();
      if (p.type === 'WEAPON') {
        ship.weaponLevel = Math.min(4, ship.weaponLevel + 1);
        score += 250;
        addFloat(ship.x, ship.y - 25, `⚡ WEAPON LVL ${ship.weaponLevel}!`, '#00f5d4');
      } else if (p.type === 'HEAL') {
        ship.hp = Math.min(100, ship.hp + 35);
        addFloat(ship.x, ship.y - 25, '+35 ARMOR REPAIR', '#06d6a0');
      } else {
        ship.novaCharges = Math.min(3, ship.novaCharges + 1);
        addFloat(ship.x, ship.y - 25, '+1 NOVA BOMB', '#ffd166');
      }
      pickups.splice(i, 1);
      continue;
    }
    if (p.y > H + 30) pickups.splice(i, 1);
  }

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('av_best', bestScore);
  }
}

function damagePlayer(dmg) {
  ship.hp -= dmg;
  ship.invuln = 0.85;
  shake = 22;
  flashAlpha = 0.45;
  flashColor = '#ff0055';
  spawnExplosion(ship.x, ship.y, '#ff0055', 28, 300);
  AudioEngine.damage();

  if (ship.hp <= 0) {
    ship.hp = 0;
    state = 'OVER';
    spawnExplosion(ship.x, ship.y, '#ff0055', 60, 420);
  }
}

// --- RENDER ---
function drawGrid(lvl) {
  ctx.strokeStyle = `${lvl.primary}18`;
  ctx.lineWidth = 1;
  const cols = 14;
  for (let i = 0; i <= cols; i++) {
    const x = (i / cols) * W;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  const offset = (time * 90) % 60;
  for (let y = offset; y < H; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawShip(x, y, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ship.tilt);

  // Engine Flame
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(-7, 16);
  ctx.lineTo(0, 28 + Math.random() * 12);
  ctx.lineTo(7, 16);
  ctx.fill();

  // Sleek Fighter Hull
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(20, 16);
  ctx.lineTo(0, 9);
  ctx.lineTo(-20, 16);
  ctx.closePath();
  ctx.fill();

  // Wing Neon Trim
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.restore();
}

function draw() {
  const lvl = getLvl();
  ctx.save();

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, lvl.bg1);
  bg.addColorStop(1, lvl.bg2);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawGrid(lvl);

  stars.forEach(s => {
    ctx.fillStyle = 'rgba(210, 235, 255, 0.55)';
    ctx.fillRect(s.x, s.y, s.size, s.size * 2.5);
  });

  ctx.globalCompositeOperation = 'lighter';

  // Pickups
  pickups.forEach(p => {
    const col = p.type === 'WEAPON' ? '#00f5d4' : (p.type === 'HEAL' ? '#06d6a0' : '#ffd166');
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#03040a';
    ctx.font = '900 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(p.type[0], p.x, p.y + 4);
  });

  // Bullets
  bullets.forEach(b => {
    ctx.fillStyle = b.col;
    ctx.fillRect(b.x - 2.5, b.y - 12, 5, 20);
  });

  // Enemy Bullets
  enemyBullets.forEach(eb => {
    ctx.fillStyle = eb.col;
    ctx.beginPath(); ctx.arc(eb.x, eb.y, 5.5, 0, Math.PI * 2); ctx.fill();
  });

  // Enemies
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.moveTo(0, e.size);
    ctx.lineTo(e.size, -e.size);
    ctx.lineTo(0, -e.size * 0.4);
    ctx.lineTo(-e.size, -e.size);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // Dreadnought Boss
  if (boss) {
    ctx.save();
    ctx.translate(boss.x, boss.y);
    ctx.fillStyle = '#ff0055';
    ctx.beginPath();
    ctx.moveTo(0, 48);
    ctx.lineTo(68, -10);
    ctx.lineTo(42, -42);
    ctx.lineTo(-42, -42);
    ctx.lineTo(-68, -10);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(0, 5, 16 + Math.sin(time * 8) * 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Player Ship
  if (state === 'PLAY' || state === 'LEVELCLEAR') {
    if (ship.invuln <= 0 || Math.floor(time * 20) % 2 === 0) {
      drawShip(ship.x, ship.y, lvl.primary);
    }
  }

  shockwaves.forEach(w => {
    ctx.strokeStyle = w.color;
    ctx.globalAlpha = Math.max(0, w.life);
    ctx.lineWidth = 3 * w.life;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
  });
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  floatTexts.forEach(f => {
    ctx.fillStyle = f.color;
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = '800 15px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  // --- HUD ---
  if (state === 'PLAY') {
    // Top Left: Score & Level
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 24px system-ui';
    ctx.fillText(score.toLocaleString(), 20, 36);

    ctx.fillStyle = lvl.primary;
    ctx.font = '800 13px system-ui';
    ctx.fillText(`LEVEL ${currentLevel}/10 • ${lvl.name}`, 20, 56);

    // Level Progress Bar
    const pw = 150;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(20, 64, pw, 6);
    ctx.fillStyle = boss ? '#ff0055' : lvl.primary;
    const prog = boss ? (boss.hp / boss.maxHp) : Math.min(1, levelKills / lvl.target);
    ctx.fillRect(20, 64, pw * prog, 6);

    // Top Right: Armor HP & Nova Bombs
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 13px system-ui';
    ctx.fillText(`ARMOR ${ship.hp}%`, W - 20, 32);

    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(W - 150, 38, 130, 8);
    ctx.fillStyle = ship.hp > 35 ? '#06d6a0' : '#ff0055';
    ctx.fillRect(W - 150, 38, 130 * (ship.hp / 100), 8);

    ctx.fillStyle = '#ffd166';
    ctx.font = '800 13px system-ui';
    ctx.fillText(`NOVA BOMBS: ${'⚡'.repeat(ship.novaCharges)} (2x TAP / SPACE)`, W - 20, 64);
  }

  if (flashAlpha > 0) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flashAlpha;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // --- MENU WITH 10-LEVEL SELECTOR ---
  if (state === 'MENU') {
    ctx.fillStyle = 'rgba(3, 4, 10, 0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#00f5d4';
    ctx.font = '900 40px system-ui';
    ctx.fillText('AETHER VANGUARD', W / 2, H * 0.18);

    ctx.fillStyle = '#ffd166';
    ctx.font = '800 14px system-ui';
    ctx.fillText(`10-LEVEL GALACTIC CAMPAIGN  •  BEST SCORE: ${bestScore.toLocaleString()}`, W / 2, H * 0.18 + 28);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '500 14px system-ui';
    ctx.fillText('DRAG / ARROWS to Fly  •  DOUBLE-TAP / SPACE for Nova Bomb', W / 2, H * 0.18 + 56);

    // 10-Level Grid (2 Rows x 5 Columns)
    levelBtns = [];
    const cols = 5;
    const bw = Math.min(115, (W - 60) / cols - 10);
    const bh = 68;
    const gap = 12;
    const totalW = cols * bw + (cols - 1) * gap;
    const startX = W / 2 - totalW / 2;
    const startY = H * 0.36;

    LEVELS.forEach((l, idx) => {
      const r = Math.floor(idx / cols);
      const c = idx % cols;
      const bx = startX + c * (bw + gap);
      const by = startY + r * (bh + gap);
      const unlocked = l.num <= unlockedLevel;
      levelBtns.push({ x: bx, y: by, w: bw, h: bh, lvl: l.num });

      ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.02)';
      ctx.strokeStyle = unlocked ? l.primary : 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 2;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeRect(bx, by, bw, bh);

      ctx.fillStyle = unlocked ? l.primary : 'rgba(255,255,255,0.3)';
      ctx.font = '900 18px system-ui';
      ctx.fillText(unlocked ? `LVL ${l.num}` : `🔒 ${l.num}`, bx + bw / 2, by + 30);

      ctx.fillStyle = unlocked ? '#ffffff' : 'rgba(255,255,255,0.25)';
      ctx.font = '700 10px system-ui';
      ctx.fillText(l.name.split(' ')[0], bx + bw / 2, by + 50);
    });

    const pulse = 0.55 + Math.sin(time * 5) * 0.45;
    ctx.fillStyle = `rgba(0, 245, 212, ${pulse})`;
    ctx.font = '800 17px system-ui';
    ctx.fillText('CLICK ANY UNLOCKED LEVEL TO LAUNCH', W / 2, startY + 2 * (bh + gap) + 42);
  }

  // --- LEVEL CLEAR / OVER / VICTORY ---
  if (state === 'LEVELCLEAR' || state === 'OVER' || state === 'VICTORY') {
    ctx.fillStyle = 'rgba(3, 4, 10, 0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    if (state === 'LEVELCLEAR') {
      ctx.fillStyle = '#06d6a0';
      ctx.font = '900 38px system-ui';
      ctx.fillText(`LEVEL ${currentLevel} CLEARED!`, W / 2, H / 2 - 40);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 18px system-ui';
      ctx.fillText(`SCORE: ${score.toLocaleString()}  •  +1 NOVA BOMB RESTORED`, W / 2, H / 2 + 5);
      ctx.fillStyle = '#ffd166';
      ctx.font = '800 17px system-ui';
      ctx.fillText(`TAP OR PRESS SPACE FOR LEVEL ${currentLevel + 1}`, W / 2, H / 2 + 55);
    } else if (state === 'VICTORY') {
      ctx.fillStyle = '#ffd166';
      ctx.font = '900 40px system-ui';
      ctx.fillText('ALL 10 LEVELS CONQUERED!', W / 2, H / 2 - 40);
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 24px system-ui';
      ctx.fillText(`FINAL SCORE: ${score.toLocaleString()}`, W / 2, H / 2 + 8);
      ctx.fillStyle = '#00f5d4';
      ctx.font = '700 16px system-ui';
      ctx.fillText('TAP TO RETURN TO MISSION MAP', W / 2, H / 2 + 55);
    } else {
      ctx.fillStyle = '#ff0055';
      ctx.font = '900 40px system-ui';
      ctx.fillText('SHIP DESTROYED', W / 2, H / 2 - 40);
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 22px system-ui';
      ctx.fillText(`REACHED LEVEL ${currentLevel}  •  SCORE: ${score.toLocaleString()}`, W / 2, H / 2 + 6);
      ctx.fillStyle = '#00f5d4';
      ctx.font = '700 16px system-ui';
      ctx.fillText('TAP OR PRESS SPACE FOR LEVEL SELECT', W / 2, H / 2 + 55);
    }
  }

  ctx.restore();
}

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
