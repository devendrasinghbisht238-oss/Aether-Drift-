<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHER DRIFT // ASCENSION</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: #020206;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, CX, CY, BASE_R;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CX = W / 2;
  CY = H / 2;
  BASE_R = Math.min(W, H) * 0.22;
}
window.addEventListener('resize', resize);
resize();

// --- 10 DIMENSION THEMES ---
const LEVELS = [
  { name: 'CYBER NEON',     primary: '#00f5d4', accent: '#ff007f', bg: '#0c1226' },
  { name: 'SOLAR FLARE',    primary: '#ffd166', accent: '#f77f00', bg: '#211306' },
  { name: 'CRIMSON VOID',   primary: '#ff4d6d', accent: '#ffbe0b', bg: '#24070e' },
  { name: 'EMERALD MATRIX', primary: '#06d6a0', accent: '#80ed99', bg: '#061f18' },
  { name: 'ASTRAL VIOLET',  primary: '#c77dff', accent: '#00bbf9', bg: '#180a29' },
  { name: 'COBALT STORM',   primary: '#3a86ff', accent: '#ff006e', bg: '#08152e' },
  { name: 'PLASMA ROSE',    primary: '#ff70a6', accent: '#70d6ff', bg: '#260b1a' },
  { name: 'TOXIC REACTOR',  primary: '#b5e48c', accent: '#ffd166', bg: '#152108' },
  { name: 'OMEGA ECLIPSE',  primary: '#f72585', accent: '#4cc9f0', bg: '#1f0618' },
  { name: 'SINGULARITY',    primary: '#ffffff', accent: '#ffd166', bg: '#1c1912' }
];

// --- SYNTH AUDIO ENGINE ---
const AudioEngine = (() => {
  let actx = null;
  let beatTimer = 0;
  let step = 0;
  const bassNotes = [55, 55, 65.41, 55, 73.42, 65.41, 49, 55];

  function init() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }

  function tone(type, f1, f2, dur, vol = 0.12) {
    if (!actx) return;
    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }

  function tickMusic(dt, active, overdrive, level) {
    if (!actx || !active) return;
    beatTimer -= dt;
    if (beatTimer <= 0) {
      beatTimer = Math.max(0.11, (overdrive ? 0.135 : 0.185) - level * 0.004);
      const mult = overdrive ? 1.5 : 1 + (level - 1) * 0.03;
      const freq = bassNotes[step % bassNotes.length] * mult;
      tone('sawtooth', freq, freq * 0.85, 0.13, 0.05);
      if (step % 4 === 0) tone('sine', 115, 30, 0.15, 0.11);
      if (step % 4 === 2 && overdrive) tone('triangle', 880, 440, 0.05, 0.03);
      step++;
    }
  }

  return {
    init, tickMusic,
    shift: (out) => tone('triangle', out ? 290 : 560, out ? 700 : 210, 0.11, 0.13),
    dash: () => { tone('sawtooth', 320, 1280, 0.18, 0.18); tone('sine', 160, 40, 0.22, 0.16); },
    shoot: (od) => tone('sawtooth', od ? 1320 : 940, od ? 420 : 300, 0.05, 0.045),
    kill: (combo) => {
      const pitch = Math.min(1350, 410 + combo * 52);
      tone('sine', pitch, pitch * 1.75, 0.16, 0.15);
      tone('triangle', 155, 42, 0.2, 0.16);
    },
    nearMiss: () => tone('sine', 980, 1480, 0.12, 0.1),
    orb: () => tone('sine', 720, 1480, 0.14, 0.13),
    levelUp: () => {
      tone('triangle', 440, 880, 0.2, 0.16);
      setTimeout(() => tone('triangle', 660, 1320, 0.28, 0.16), 110);
    },
    crash: () => {
      tone('sawtooth', 195, 22, 0.65, 0.28);
      tone('square', 92, 18, 0.72, 0.22);
    }
  };
})();

// --- GAME STATE ---
let state = 'MENU'; // MENU, PLAY, UPGRADE, OVER
let holding = false;
let score = 0;
let best = Number(localStorage.getItem('aether_ascension_best') || 0);
let level = 1;
let nextLevelScore = 1000;
let combo = 1;
let maxCombo = 1;
let comboTimer = 0;
let wasOverdrive = false;
let shake = 0;
let hitStop = 0;
let slowMoTimer = 0;
let glitchTimer = 0;
let flashAlpha = 0;
let flashColor = '#ffffff';
let time = 0;
let kills = 0;
let lastTapTime = 0;
let copiedBannerTimer = 0;

// Upgrades & Abilities
let upgrades = { twinDrone: false, piercing: false, rapidFire: false };
let upgradeChoices = [];
let cardRects = [];
let shareBtnRect = { x: 0, y: 0, w: 0, h: 0 };

const player = {
  angle: -Math.PI / 2,
  angVel: 2.38,
  radius: 100,
  targetRadius: 100,
  trail: [],
  fireCooldown: 0,
  droneCooldown: 0,
  shield: 1,
  dashTimer: 0,
  dashCooldown: 0
};

let stars = [];
let enemies = [];
let bullets = [];
let pickups = [];
let particles = [];
let shockwaves = [];
let floatTexts = [];
let boss = null;

for (let i = 0; i < 140; i++) {
  stars.push({
    x: Math.random() * 2400 - 1200,
    y: Math.random() * 2400 - 1200,
    z: Math.random() * 2.6 + 0.4,
    size: Math.random() * 2.2 + 0.5
  });
}

function getTheme() {
  return LEVELS[Math.min(LEVELS.length - 1, level - 1)];
}

function addFloatText(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 1, vy: -54 });
}

function addShockwave(x, y, maxR, color) {
  shockwaves.push({ x, y, r: 8, maxR, color, life: 1 });
}

function spawnParticles(x, y, color, count = 20, speed = 290) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.2 + Math.random() * 0.85) * speed;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      size: 2 + Math.random() * 4.5,
      color,
      life: 1,
      decay: 1.3 + Math.random() * 1.3
    });
  }
}

function triggerHyperDash() {
  if (state !== 'PLAY' || player.dashCooldown > 0) return;
  player.dashTimer = 0.28;
  player.dashCooldown = 3.0;
  shake = 14;
  glitchTimer = 0.15;
  const px = CX + Math.cos(player.angle) * player.radius;
  const py = CY + Math.sin(player.angle) * player.radius;
  spawnParticles(px, py, '#ffffff', 25, 320);
  addShockwave(px, py, 110, '#ffffff');
  addFloatText(px, py - 20, '⚡ HYPER-DASH!', '#ffffff');
  AudioEngine.dash();
}

function openUpgradeScreen() {
  const pool = [
    { id: 'twinDrone', title: 'TWIN DRONE', desc: 'Adds an orbital helper turret that auto-fires.' },
    { id: 'piercing', title: 'PIERCING PLASMA', desc: 'Lasers slice through multiple enemies.' },
    { id: 'rapidFire', title: 'OVERCLOCK CORE', desc: '+45% fire rate & faster plasma bolts.' },
    { id: 'shield', title: 'AEGIS SHIELD', desc: 'Restores energy shield + +500 bonus score.' }
  ];
  const available = pool.filter(u => u.id === 'shield' || !upgrades[u.id]);
  available.sort(() => Math.random() - 0.5);
  upgradeChoices = available.slice(0, 2);
  state = 'UPGRADE';
  holding = false;
  AudioEngine.levelUp();
}

function selectUpgrade(idx) {
  const choice = upgradeChoices[idx];
  if (!choice) return;
  if (choice.id === 'shield') {
    player.shield = 1;
    score += 500;
  } else {
    upgrades[choice.id] = true;
  }
  flashAlpha = 0.35;
  flashColor = getTheme().primary;
  addShockwave(CX, CY, BASE_R * 2.5, getTheme().primary);
  state = 'PLAY';
  AudioEngine.shift(true);
}

function startGame() {
  AudioEngine.init();
  state = 'PLAY';
  score = 0;
  kills = 0;
  level = 1;
  nextLevelScore = 1000;
  combo = 1;
  maxCombo = 1;
  comboTimer = 0;
  wasOverdrive = false;
  time = 0;
  slowMoTimer = 0;
  upgrades = { twinDrone: false, piercing: false, rapidFire: false };
  enemies = [];
  bullets = [];
  pickups = [];
  particles = [];
  shockwaves = [];
  floatTexts = [];
  boss = null;
  player.angle = -Math.PI / 2;
  player.radius = BASE_R * 0.68;
  player.trail = [];
  player.shield = 1;
  player.dashTimer = 0;
  player.dashCooldown = 0;
  flashAlpha = 0.42;
  flashColor = '#00f5d4';
  glitchTimer = 0.2;
  addShockwave(CX, CY, BASE_R * 2.5, '#00f5d4');
  AudioEngine.shift(true);
}

function copyScoreCard() {
  const text = `🚀 AETHER DRIFT | Level ${level}/10 (${getTheme().name})\n🏆 Score: ${score.toLocaleString()} | Max Combo: ${maxCombo}x ⚡\nCan you beat my run? 👉 ${window.location.href}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
  }
  copiedBannerTimer = 2.5;
  AudioEngine.orb();
}

function handlePointerDown(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (state === 'UPGRADE') {
    for (let i = 0; i < cardRects.length; i++) {
      const r = cardRects[i];
      if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
        selectUpgrade(i);
        return;
      }
    }
    return;
  }

  if (state === 'OVER') {
    const b = shareBtnRect;
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      copyScoreCard();
      return;
    }
    startGame();
    return;
  }

  if (state === 'MENU') {
    startGame();
    return;
  }

  // Double-tap detection for Hyper-Dash
  const now = performance.now();
  if (now - lastTapTime < 260) {
    triggerHyperDash();
  }
  lastTapTime = now;

  if (!holding) {
    AudioEngine.shift(true);
    const px = CX + Math.cos(player.angle) * player.radius;
    const py = CY + Math.sin(player.angle) * player.radius;
    spawnParticles(px, py, getTheme().accent, 10, 145);
  }
  holding = true;
}

window.addEventListener('pointerdown', handlePointerDown);
window.addEventListener('pointerup', () => {
  if (holding && state === 'PLAY') AudioEngine.shift(false);
  holding = false;
});
window.addEventListener('pointercancel', () => { holding = false; });
window.addEventListener('keydown', (e) => {
  if (state === 'UPGRADE') {
    if (e.key === '1') selectUpgrade(0);
    if (e.key === '2') selectUpgrade(1);
    return;
  }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyE') {
    triggerHyperDash();
    return;
  }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (!e.repeat) {
      if (state !== 'PLAY') startGame();
      else {
        holding = true;
        AudioEngine.shift(true);
      }
    }
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (holding && state === 'PLAY') AudioEngine.shift(false);
    holding = false;
  }
});

let spawnTimer = 0;
let orbTimer = 0;

function spawnEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(W, H) * 0.72;
  const isHunter = Math.random() < Math.min(0.55, 0.15 + level * 0.04);
  enemies.push({
    x: CX + Math.cos(angle) * dist,
    y: CY + Math.sin(angle) * dist,
    angle,
    dist,
    speed: (95 + Math.random() * 52) * (1 + (level - 1) * 0.08),
    spin: (Math.random() - 0.5) * (isHunter ? 1.55 : 0.42),
    size: isHunter ? 14 : 11,
    hp: isHunter ? (level >= 6 ? 3 : 2) : 1,
    type: isHunter ? 'hunter' : 'drone',
    grazed: false
  });
}

function spawnEnergyOrb() {
  const outer = Math.random() > 0.45;
  pickups.push({
    angle: Math.random() * Math.PI * 2,
    orbitMult: outer ? 1.38 : 0.68,
    pulse: 0,
    life: 9
  });
}

function spawnBoss() {
  boss = {
    hp: 34 + level * 6,
    maxHp: 34 + level * 6,
    laserAngle: Math.random() * Math.PI * 2,
    laserSpin: 0.72 + level * 0.05,
    dualLaser: level >= 3,
    warnTimer: 1.5
  };
  glitchTimer = 0.38;
  shake = 22;
  flashAlpha = 0.48;
  flashColor = '#9b5de5';
  addShockwave(CX, CY, BASE_R * 2.9, '#9b5de5');
  addFloatText(CX, CY - BASE_R * 1.6, '⚠ VOID TITAN DETECTED ⚠', '#ff007f');
  AudioEngine.levelUp();
}

// --- UPDATE ---
let lastTime = performance.now();
function update(rawDt) {
  copiedBannerTimer = Math.max(0, copiedBannerTimer - rawDt);

  if (hitStop > 0) {
    hitStop -= rawDt;
    return;
  }

  if (state === 'UPGRADE') return;

  slowMoTimer = Math.max(0, slowMoTimer - rawDt);
  const dt = slowMoTimer > 0 ? rawDt * 0.42 : rawDt;

  time += dt;
  shake *= Math.pow(0.035, rawDt);
  glitchTimer = Math.max(0, glitchTimer - rawDt);
  flashAlpha = Math.max(0, flashAlpha - rawDt * 1.9);

  const isOverdrive = combo >= 5;
  AudioEngine.tickMusic(rawDt, state === 'PLAY', isOverdrive, level);

  if (isOverdrive && !wasOverdrive && state === 'PLAY') {
    wasOverdrive = true;
    glitchTimer = 0.25;
    flashAlpha = 0.36;
    flashColor = '#ffd166';
    addShockwave(CX, CY, BASE_R * 2.5, '#ffd166');
    addFloatText(CX, CY - 55, '⚡ OVERDRIVE 3X LASER ⚡', '#ffd166');
    AudioEngine.levelUp();
  } else if (!isOverdrive) {
    wasOverdrive = false;
  }

  stars.forEach(s => {
    const spd = (isOverdrive || player.dashTimer > 0) ? 55 : (18 + level * 2);
    s.x -= Math.cos(time * 0.15) * spd * s.z * dt;
    s.y -= Math.sin(time * 0.15) * spd * s.z * dt;
    if (s.x < -W) s.x += W * 2;
    if (s.x > W) s.x -= W * 2;
    if (s.y < -H) s.y += H * 2;
    if (s.y > H) s.y -= H * 2;
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += (sw.maxR - sw.r) * 7.5 * dt;
    sw.life -= 2.1 * dt;
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= 1.25 * dt;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }

  if (state !== 'PLAY') {
    player.angle += 1.25 * dt;
    return;
  }

  if (combo > 1) {
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 1;
  }

  // Level Up Check (10 Levels)
  if (score >= nextLevelScore && level < 10) {
    level++;
    nextLevelScore += 1200 + level * 250;
    if (level % 2 === 0 && !boss) spawnBoss();
    openUpgradeScreen();
    return;
  }

  player.dashTimer = Math.max(0, player.dashTimer - dt);
  player.dashCooldown = Math.max(0, player.dashCooldown - dt);

  const innerR = BASE_R * 0.68;
  const outerR = BASE_R * 1.38;
  player.targetRadius = holding ? outerR : innerR;
  player.radius += (player.targetRadius - player.radius) * Math.min(1, 17 * dt);

  const dashMult = player.dashTimer > 0 ? 2.6 : 1;
  const speedMult = (holding ? 1.3 : 0.96) * dashMult;
  player.angle += player.angVel * speedMult * (1 + (level - 1) * 0.035) * dt;

  const px = CX + Math.cos(player.angle) * player.radius;
  const py = CY + Math.sin(player.angle) * player.radius;

  const theme = getTheme();
  const trailColor = player.dashTimer > 0 ? '#ffffff' : (isOverdrive ? '#ffd166' : (holding ? theme.accent : theme.primary));
  player.trail.push({ x: px, y: py, color: trailColor });
  if (player.trail.length > 24) player.trail.shift();

  // Main Ship Plasma Fire
  player.fireCooldown -= dt;
  const fireRate = (isOverdrive ? 0.105 : 0.14) * (upgrades.rapidFire ? 0.65 : 1);
  const boltSpeed = upgrades.rapidFire ? 840 : 690;
  if (holding && player.fireCooldown <= 0) {
    player.fireCooldown = fireRate;
    const angles = isOverdrive ? [player.angle - 0.16, player.angle, player.angle + 0.16] : [player.angle];
    angles.forEach(a => {
      bullets.push({
        x: px, y: py,
        vx: Math.cos(a) * boltSpeed,
        vy: Math.sin(a) * boltSpeed,
        color: isOverdrive ? '#ffd166' : theme.primary,
        pierce: upgrades.piercing ? 3 : 1,
        life: 1.05
      });
    });
    AudioEngine.shoot(isOverdrive);
  }

  // Twin Helper Drone Auto-Fire
  if (upgrades.twinDrone) {
    player.droneCooldown -= dt;
    if (player.droneCooldown <= 0) {
      player.droneCooldown = 0.28;
      const dAng = player.angle + Math.PI;
      const dx = CX + Math.cos(dAng) * (BASE_R * 0.68);
      const dy = CY + Math.sin(dAng) * (BASE_R * 0.68);
      bullets.push({
        x: dx, y: dy,
        vx: Math.cos(dAng) * 650,
        vy: Math.sin(dAng) * 650,
        color: '#00f5d4',
        pierce: 1,
        life: 1.0
      });
    }
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    if (boss && Math.hypot(b.x - CX, b.y - CY) < 42) {
      bullets.splice(i, 1);
      boss.hp--;
      shake = 6;
      spawnParticles(b.x, b.y, '#9b5de5', 6, 150);
      if (boss.hp <= 0) {
        score += 1000;
        kills++;
        player.shield = 1;
        shake = 32;
        hitStop = 0.085;
        glitchTimer = 0.42;
        flashAlpha = 0.68;
        flashColor = '#ffd166';
        spawnParticles(CX, CY, '#ffd166', 60, 440);
        addShockwave(CX, CY, BASE_R * 3.3, '#ffd166');
        addFloatText(CX, CY - 30, '+1000 TITAN DESTROYED! SHIELD RESTORED', '#ffd166');
        AudioEngine.kill(12);
        boss = null;
      }
      continue;
    }

    if (b.life <= 0) bullets.splice(i, 1);
  }

  if (boss) {
    if (boss.warnTimer > 0) {
      boss.warnTimer -= dt;
    } else {
      boss.laserAngle += boss.laserSpin * dt;
      if (player.dashTimer <= 0) {
        const beams = boss.dualLaser ? [boss.laserAngle, boss.laserAngle + Math.PI] : [boss.laserAngle];
        for (const ba of beams) {
          let diff = Math.atan2(Math.sin(player.angle - ba), Math.cos(player.angle - ba));
          if (Math.abs(diff) < 0.085) {
            triggerPlayerDamage(px, py);
            break;
          }
        }
      }
    }
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(0.32, 1.28 - level * 0.085) * (boss ? 1.45 : 1);
  }
  orbTimer -= dt;
  if (orbTimer <= 0) {
    spawnEnergyOrb();
    orbTimer = 2.3;
  }

  for (let i = pickups.length - 1; i >= 0; i--) {
    const o = pickups[i];
    o.pulse += 6 * dt;
    o.life -= dt;
    const ox = CX + Math.cos(o.angle) * (BASE_R * o.orbitMult);
    const oy = CY + Math.sin(o.angle) * (BASE_R * o.orbitMult);
    if (Math.hypot(px - ox, py - oy) < 26) {
      const pts = 50 * combo;
      score += pts;
      combo = Math.min(12, combo + 1);
      maxCombo = Math.max(maxCombo, combo);
      comboTimer = 3.5;
      shake = 6;
      spawnParticles(ox, oy, '#ffd166', 16, 190);
      addShockwave(ox, oy, 70, '#ffd166');
      addFloatText(ox, oy - 12, `+${pts} (${combo}x)`, '#ffd166');
      AudioEngine.orb();
      pickups.splice(i, 1);
      continue;
    }
    if (o.life <= 0) pickups.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.dist -= e.speed * dt;
    e.angle += e.spin * dt;
    e.x = CX + Math.cos(e.angle) * e.dist;
    e.y = CY + Math.sin(e.angle) * e.dist;

    let destroyed = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.size + 9) {
        b.pierce--;
        if (b.pierce <= 0) bullets.splice(j, 1);
        e.hp--;
        spawnParticles(e.x, e.y, '#ffbe0b', 7, 150);
        if (e.hp <= 0) {
          const pts = 100 * combo;
          score += pts;
          kills++;
          combo = Math.min(12, combo + 1);
          maxCombo = Math.max(maxCombo, combo);
          comboTimer = 3.6;
          shake = 12;
          hitStop = 0.022;
          spawnParticles(e.x, e.y, e.type === 'hunter' ? '#9b5de5' : theme.accent, 24, 300);
          addShockwave(e.x, e.y, 92, theme.accent);
          addFloatText(e.x, e.y - 10, `+${pts}`, theme.primary);
          AudioEngine.kill(combo);
          enemies.splice(i, 1);
          destroyed = true;
        }
        break;
      }
    }
    if (destroyed) continue;

    const distToPlayer = Math.hypot(px - e.x, py - e.y);

    // Hyper-Dash Smashes Enemies!
    if (player.dashTimer > 0 && distToPlayer < e.size + 22) {
      const pts = 150 * combo;
      score += pts;
      kills++;
      shake = 14;
      spawnParticles(e.x, e.y, '#ffffff', 26, 320);
      addShockwave(e.x, e.y, 100, '#ffffff');
      addFloatText(e.x, e.y - 12, `DASH SMASH +${pts}`, '#ffffff');
      AudioEngine.kill(combo);
      enemies.splice(i, 1);
      continue;
    }

    // Near-Miss Bullet-Time Bonus
    if (!e.grazed && distToPlayer < e.size + 28 && distToPlayer >= e.size + 9) {
      e.grazed = true;
      slowMoTimer = 0.35;
      score += 150;
      addFloatText(px, py - 24, 'NEAR MISS +150', theme.primary);
      AudioEngine.nearMiss();
    }

    if (distToPlayer < e.size + 9) {
      enemies.splice(i, 1);
      if (!triggerPlayerDamage(px, py)) return;
      continue;
    }

    if (e.dist < 26) {
      enemies.splice(i, 1);
      addShockwave(CX, CY, 55, '#ff0055');
      shake = 5;
    }
  }

  score += Math.floor(15 * dt * combo);
  if (score > best) {
    best = score;
    localStorage.setItem('aether_ascension_best', best);
  }
}

function triggerPlayerDamage(px, py) {
  if (player.shield > 0) {
    player.shield = 0;
    shake = 22;
    hitStop = 0.055;
    glitchTimer = 0.25;
    flashAlpha = 0.46;
    flashColor = '#00f5d4';
    spawnParticles(px, py, '#00f5d4', 34, 350);
    addShockwave(px, py, 175, '#00f5d4');
    addFloatText(px, py - 22, 'SHIELD ABSORBED!', '#00f5d4');
    AudioEngine.crash();
    return true;
  } else {
    state = 'OVER';
    holding = false;
    slowMoTimer = 0;
    shake = 30;
    hitStop = 0.075;
    glitchTimer = 0.55;
    flashAlpha = 0.68;
    flashColor = '#ff0055';
    spawnParticles(px, py, '#ff0055', 55, 420);
    addShockwave(px, py, 270, '#ff0055');
    AudioEngine.crash();
    if (score > best) {
      best = score;
      localStorage.setItem('aether_ascension_best', best);
    }
    return false;
  }
}

// --- RENDER ---
function drawCyberGrid(theme, isOverdrive) {
  const horizon = CY;
  ctx.strokeStyle = isOverdrive ? 'rgba(255, 209, 102, 0.18)' : `${theme.primary}22`;
  ctx.lineWidth = 1;

  const rays = 16;
  for (let i = -rays; i <= rays; i++) {
    const spread = (i / rays) * W * 1.4;
    ctx.beginPath();
    ctx.moveTo(CX + spread * 0.12, horizon);
    ctx.lineTo(CX + spread, H);
    ctx.stroke();
  }

  const speed = isOverdrive ? 1.65 : 0.78 + level * 0.05;
  const offset = (time * speed) % 1;
  for (let i = 0; i < 10; i++) {
    const t = (i + offset) / 10;
    const y = horizon + Math.pow(t, 2.2) * (H - horizon);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function draw() {
  const theme = getTheme();
  const isOverdrive = combo >= 5 && state === 'PLAY';
  ctx.save();

  if (state === 'PLAY') {
    const tiltX = Math.cos(player.angle) * (holding ? -10 : -4);
    const tiltY = Math.sin(player.angle) * (holding ? -10 : -4);
    ctx.translate(tiltX, tiltY);
  }

  const bgGrad = ctx.createRadialGradient(CX, CY, 15, CX, CY, Math.max(W, H) * 0.78);
  bgGrad.addColorStop(0, isOverdrive ? '#261908' : theme.bg);
  bgGrad.addColorStop(1, '#020206');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-30, -30, W + 60, H + 60);

  if (shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawCyberGrid(theme, isOverdrive);

  stars.forEach(s => {
    const sx = CX + s.x;
    const sy = CY + s.y;
    ctx.fillStyle = `rgba(210, 235, 255, ${0.25 + s.z * 0.25})`;
    if (isOverdrive || player.dashTimer > 0) {
      ctx.fillRect(sx, sy, s.size * 3.8, s.size * 0.8);
    } else {
      ctx.fillRect(sx, sy, s.size, s.size);
    }
  });

  ctx.globalCompositeOperation = 'lighter';

  const innerR = BASE_R * 0.68;
  const outerR = BASE_R * 1.38;

  ctx.lineWidth = 2;
  ctx.setLineDash([7, 9]);
  ctx.strokeStyle = !holding ? `${theme.primary}88` : 'rgba(255, 255, 255, 0.12)';
  ctx.beginPath(); ctx.arc(CX, CY, innerR, 0, Math.PI * 2); ctx.stroke();

  ctx.strokeStyle = holding ? (isOverdrive ? 'rgba(255, 209, 102, 0.8)' : `${theme.accent}99`) : 'rgba(255, 255, 255, 0.12)';
  ctx.beginPath(); ctx.arc(CX, CY, outerR, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Central Reactor Core / Boss
  const corePulse = (boss ? 36 : 22) + Math.sin(time * 6) * 3.5;
  const coreCol = boss ? '#9b5de5' : (isOverdrive ? '#ffd166' : (holding ? theme.accent : theme.primary));
  const coreGrad = ctx.createRadialGradient(CX, CY, 2, CX, CY, corePulse * 2.4);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.35, coreCol);
  coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath(); ctx.arc(CX, CY, corePulse * 2.4, 0, Math.PI * 2); ctx.fill();

  if (boss) {
    const beamLen = Math.max(W, H);
    const beams = boss.dualLaser ? [boss.laserAngle, boss.laserAngle + Math.PI] : [boss.laserAngle];
    beams.forEach(ba => {
      const bx = CX + Math.cos(ba) * beamLen;
      const by = CY + Math.sin(ba) * beamLen;
      if (boss.warnTimer > 0) {
        ctx.strokeStyle = 'rgba(255, 0, 127, 0.45)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(bx, by); ctx.stroke();
        ctx.setLineDash([]);
      } else {
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(bx, by); ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(bx, by); ctx.stroke();
      }
    });
  }

  pickups.forEach(o => {
    const ox = CX + Math.cos(o.angle) * (BASE_R * o.orbitMult);
    const oy = CY + Math.sin(o.angle) * (BASE_R * o.orbitMult);
    const r = 7.5 + Math.sin(o.pulse) * 2;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(ox, oy, r, 0, Math.PI * 2); ctx.fill();
  });

  bullets.forEach(b => {
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.028, b.y - b.vy * 0.028);
    ctx.stroke();
  });

  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(time * 4.5 + e.angle);
    ctx.fillStyle = e.type === 'hunter' ? '#9b5de5' : theme.accent;
    ctx.beginPath();
    const sides = e.type === 'hunter' ? 4 : 3;
    for (let s = 0; s < sides; s++) {
      const a = (s / sides) * Math.PI * 2;
      const rx = Math.cos(a) * e.size;
      const ry = Math.sin(a) * e.size;
      if (s === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // Twin Helper Drone
  if (upgrades.twinDrone && state !== 'OVER') {
    const dAng = player.angle + Math.PI;
    const dx = CX + Math.cos(dAng) * (BASE_R * 0.68);
    const dy = CY + Math.sin(dAng) * (BASE_R * 0.68);
    ctx.fillStyle = '#00f5d4';
    ctx.beginPath(); ctx.arc(dx, dy, 6.5, 0, Math.PI * 2); ctx.fill();
  }

  // Player Trail & Ship
  if (state !== 'OVER') {
    for (let i = 0; i < player.trail.length; i++) {
      const t = player.trail[i];
      const ratio = i / player.trail.length;
      ctx.fillStyle = t.color;
      ctx.globalAlpha = ratio * 0.55;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 10 * ratio, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const px = CX + Math.cos(player.angle) * player.radius;
    const py = CY + Math.sin(player.angle) * player.radius;

    if (isOverdrive || player.dashTimer > 0) {
      ctx.strokeStyle = player.dashTimer > 0 ? '#ffffff' : '#ffd166';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(px, py);
      for (let k = 1; k <= 3; k++) {
        const ang = player.angle - k * 0.18;
        const rOff = player.radius + (Math.random() - 0.5) * 28;
        ctx.lineTo(CX + Math.cos(ang) * rOff, CY + Math.sin(ang) * rOff);
      }
      ctx.stroke();
    }

    if (player.shield > 0) {
      ctx.strokeStyle = `${theme.primary}cc`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, py, 16 + Math.sin(time * 8) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py, 9.5, 0, Math.PI * 2);
    ctx.fill();
  }

  shockwaves.forEach(sw => {
    ctx.strokeStyle = sw.color;
    ctx.globalAlpha = Math.max(0, sw.life);
    ctx.lineWidth = 3.5 * sw.life;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
  });
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  if (glitchTimer > 0) {
    for (let g = 0; g < 5; g++) {
      const gy = Math.random() * H;
      const gh = 4 + Math.random() * 14;
      ctx.fillStyle = g % 2 === 0 ? 'rgba(0, 245, 212, 0.28)' : 'rgba(255, 0, 127, 0.28)';
      ctx.fillRect((Math.random() - 0.5) * 34, gy, W, gh);
    }
  }

  if (boss && state === 'PLAY') {
    const bw = Math.min(280, W * 0.6);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(CX - bw / 2, 22, bw, 8);
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(CX - bw / 2, 22, bw * (boss.hp / boss.maxHp), 8);
  }

  floatTexts.forEach(ft => {
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = '800 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 28px system-ui, sans-serif';
  ctx.fillText(score.toLocaleString(), 24, 46);

  ctx.fillStyle = theme.primary;
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillText(`LVL ${level}/10 • ${theme.name}`, 24, 67);

  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.fillText(`BEST ${best.toLocaleString()}`, 24, 85);

  if (state === 'PLAY') {
    ctx.textAlign = 'right';
    if (combo > 1) {
      ctx.fillStyle = isOverdrive ? '#ffd166' : theme.primary;
      ctx.font = '900 24px system-ui, sans-serif';
      ctx.fillText(isOverdrive ? `⚡ ${combo}x OVERDRIVE` : `${combo}x COMBO`, W - 24, 46);
    }
    ctx.fillStyle = player.dashCooldown <= 0 ? '#ffffff' : 'rgba(255,255,255,0.35)';
    ctx.font = '700 12px system-ui, sans-serif';
    ctx.fillText(player.dashCooldown <= 0 ? '⚡ HYPER-DASH READY (2x TAP / SHIFT)' : `DASH: ${player.dashCooldown.toFixed(1)}s`, W - 24, 67);
  }

  if (flashAlpha > 0) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flashAlpha;
    ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.globalAlpha = 1;
  }

  // LEVEL UP UPGRADE CARDS OVERLAY
  if (state === 'UPGRADE') {
    ctx.fillStyle = 'rgba(2, 2, 6, 0.85)';
    ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.textAlign = 'center';

    ctx.fillStyle = theme.primary;
    ctx.font = '900 32px system-ui, sans-serif';
    ctx.fillText(`LEVEL ${level} UNLOCKED`, CX, CY - 135);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '600 14px system-ui, sans-serif';
    ctx.fillText('CHOOSE AN ASCENSION MODULE (TAP OR PRESS 1 / 2)', CX, CY - 105);

    cardRects = [];
    const cw = Math.min(250, W * 0.42);
    const ch = 155;
    const gap = 20;
    const totalW = cw * upgradeChoices.length + gap * (upgradeChoices.length - 1);
    const startX = CX - totalW / 2;

    upgradeChoices.forEach((c, idx) => {
      const rx = startX + idx * (cw + gap);
      const ry = CY - 70;
      cardRects.push({ x: rx, y: ry, w: cw, h: ch });

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.strokeStyle = theme.primary;
      ctx.lineWidth = 2;
      ctx.fillRect(rx, ry, cw, ch);
      ctx.strokeRect(rx, ry, cw, ch);

      ctx.fillStyle = '#ffd166';
      ctx.font = '800 12px system-ui, sans-serif';
      ctx.fillText(`[ ${idx + 1} ]`, rx + cw / 2, ry + 26);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 18px system-ui, sans-serif';
      ctx.fillText(c.title, rx + cw / 2, ry + 56);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '500 13px system-ui, sans-serif';
      const words = c.desc.split(' ');
      let line = '', ly = ry + 86;
      words.forEach(w => {
        if ((line + w).length > 26) {
          ctx.fillText(line, rx + cw / 2, ly);
          line = w + ' ';
          ly += 18;
        } else line += w + ' ';
      });
      ctx.fillText(line, rx + cw / 2, ly);
    });
  }

  // MENU / GAME OVER OVERLAYS
  if (state === 'MENU' || state === 'OVER') {
    ctx.fillStyle = 'rgba(2, 2, 6, 0.78)';
    ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.textAlign = 'center';

    if (state === 'MENU') {
      ctx.fillStyle = '#00f5d4';
      ctx.font = '900 42px system-ui, sans-serif';
      ctx.fillText('AETHER DRIFT', CX, CY - 72);

      ctx.fillStyle = '#ffd166';
      ctx.font = '800 14px system-ui, sans-serif';
      ctx.fillText('10-LEVEL ASCENSION EDITION', CX, CY - 44);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '500 15px system-ui, sans-serif';
      ctx.fillText('HOLD: Outer Attack Ring • RELEASE: Safe Inner Ring', CX, CY - 4);
      ctx.fillText('DOUBLE-TAP / SHIFT: Invincible Hyper-Dash', CX, CY + 22);
    } else {
      ctx.fillStyle = '#ff0055';
      ctx.font = '900 40px system-ui, sans-serif';
      ctx.fillText('SIGNAL LOST', CX, CY - 95);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 28px system-ui, sans-serif';
      ctx.fillText(`SCORE: ${score.toLocaleString()}`, CX, CY - 48);

      ctx.fillStyle = '#ffd166';
      ctx.font = '700 15px system-ui, sans-serif';
      ctx.fillText(`LVL ${level}/10  •  MAX COMBO ${maxCombo}x  •  BEST ${best.toLocaleString()}`, CX, CY - 16);

      // Copy Score Card Button
      const bw = 240, bh = 40;
      const bx = CX - bw / 2, by = CY + 12;
      shareBtnRect = { x: bx, y: by, w: bw, h: bh };
      ctx.fillStyle = copiedBannerTimer > 0 ? '#06d6a0' : 'rgba(255, 255, 255, 0.12)';
      ctx.strokeStyle = '#00f5d4';
      ctx.lineWidth = 1.5;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeRect(bx, by, bw, bh);

      ctx.fillStyle = copiedBannerTimer > 0 ? '#020206' : '#00f5d4';
      ctx.font = '800 14px system-ui, sans-serif';
      ctx.fillText(copiedBannerTimer > 0 ? '✓ SCORE CARD COPIED!' : '📋 COPY SCORE CARD', CX, by + 25);
    }

    const pulseAlpha = 0.55 + Math.sin(time * 5) * 0.45;
    ctx.fillStyle = `rgba(0, 245, 212, ${pulseAlpha})`;
    ctx.font = '700 17px system-ui, sans-serif';
    ctx.fillText(state === 'MENU' ? 'TAP OR PRESS SPACE TO LAUNCH' : 'TAP ANYWHERE ELSE TO RETRY', CX, CY + 88);
  }

  ctx.restore();
}

function loop(now) {
  const rawDt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(rawDt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
